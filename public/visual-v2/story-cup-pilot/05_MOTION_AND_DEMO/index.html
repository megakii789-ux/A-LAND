<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-LAND V2.2 · 故事林素材实验场</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7f6fd;color:#14394e;font-family:system-ui,"Noto Sans SC",sans-serif}header{padding:13px clamp(12px,3vw,30px);background:#fff9ed;border-bottom:4px solid #ffe39a;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}h1{font-size:clamp(21px,2.4vw,30px);margin:0}header p{font-size:14px;margin:3px 0}.notice{background:#633e34;color:#fff7e6;font-weight:700;padding:6px 10px;border-radius:9px;font-size:13px}.wrap{width:min(1250px,100% - 20px);margin:15px auto 40px}.frame{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;min-height:380px;overflow:hidden;border-radius:24px;border:5px solid #fff;box-shadow:0 14px 36px #387c9433;background:#bdeef7;touch-action:pan-y}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.stage{position:absolute;inset:0}.prop,.actor{position:absolute;object-fit:contain;user-select:none;touch-action:none}.prop{width:clamp(70px,13%,170px);cursor:pointer;filter:drop-shadow(0 10px 7px #553f3550)}.prop:focus-visible,.control:focus-visible{outline:5px solid #1460bd;outline-offset:3px}.actor{height:40%;width:auto;max-width:27%;bottom:13%;pointer-events:none}.actor.tiaotiao{left:4%}.actor.pupu{right:5%}.block{left:20%;bottom:13%}.bucket{right:19%;bottom:13%}.ruler{left:calc(50% - 7%);bottom:2%;width:14%}.cup{left:calc(50% - 6.5%);bottom:13%;z-index:4;cursor:grab;transition:left .22s ease-out,transform .22s ease-out}.cup[data-drag="1"]{cursor:grabbing;transition:none;transform:translateY(-10px) scale(1.07)}.prop.active{filter:drop-shadow(0 0 13px #ffe37c) drop-shadow(0 7px 8px #543f3555)}.controls{display:flex;flex-wrap:wrap;gap:9px;padding:14px;background:#fff9e9;border-radius:16px;margin-top:12px;justify-content:center}.control{cursor:pointer;border:2px solid #da9f59;border-radius:14px;padding:14px 18px;background:linear-gradient(#fff,#ffe7b4);min-height:56px;font-weight:800;font-size:16px;color:#14394e}.control:hover{background:#ffe5ab}.log{background:#fff;border-radius:14px;padding:16px;margin-top:10px;min-height:88px;line-height:1.6;border:2px solid #d9eaf0} .evidence{font-size:14px;color:#345}footer{padding:20px;text-align:center;font-size:13px;color:#43576a}@media(max-width:640px){.frame{aspect-ratio:9/16;min-height:540px}.actor{bottom:32%;height:22%;max-width:38%}.actor.tiaotiao{left:5%}.actor.pupu{right:5%}.block{left:11%;bottom:16%;width:19%}.bucket{right:9%;bottom:16%;width:21%}.cup{bottom:17%;width:21%;left:39.5%}.ruler{left:34%;bottom:6%;width:33%}.controls{display:grid;grid-template-columns:1fr 1fr}.control{font-size:14px;padding:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header><div><h1>故事林 · 一只杯子，是大还是小？</h1><p>多层原生 SVG / 透明道具 / 角色动态接口 · 离线素材实验场</p></div><span class="notice">ASSET_LAB_ONLY / ART_DIRECTOR_QA_HOLD</span></header><main class="wrap"><div id="frame" class="frame" aria-label="木屋中的小积木、可拖动蓝杯及大水桶">
<picture><source media="(max-width:640px)" srcset="../01_SCENE_LAYERS/compositions/story_cup_room_mobile_background.webp"><img class="bg" src="../01_SCENE_LAYERS/compositions/story_cup_room_desktop_background.webp" alt="温暖树屋与海湾窗景"></picture>
<div class="stage"><img class="actor tiaotiao" src="../exports/webp/02_STORY_CHARACTERS/tiaotiao_story_squirrel/states/idle.webp" alt="" draggable="false"><img class="actor pupu" src="../exports/webp/02_STORY_CHARACTERS/pupu_story_elephant/states/idle.webp" alt="" draggable="false"><img id="block" class="prop block" src="../exports/webp/03_INTERACTIVE_PROPS/obj_wooden_block.webp" alt="" draggable="false"><img id="bucket" class="prop bucket" src="../exports/webp/03_INTERACTIVE_PROPS/obj_elephant_bucket.webp" alt="" draggable="false"><img class="prop ruler" src="../exports/webp/03_INTERACTIVE_PROPS/obj_twig_ruler.webp" alt="" draggable="false"><img id="cup" tabindex="0" role="button" aria-label="拖动蓝水杯，或使用下方按钮选择位置" class="prop cup" src="../exports/webp/03_INTERACTIVE_PROPS/obj_blue_cup.webp" draggable="false" data-drag="0"></div></div>
<nav class="controls" aria-label="实验场对比操作"><button class="control" data-pos="NEXT_TO_BLOCK">放在小积木旁</button><button class="control" data-pos="CENTER_TABLE">放回中间</button><button class="control" data-pos="NEXT_TO_BUCKET">放在大水桶旁</button><button class="control" data-inspect="both">对比两边</button></nav>
<section id="log" class="log" role="status" aria-live="polite"><strong>把同一只蓝杯移动到积木和水桶旁边比较。</strong><div class="evidence">这是素材实验场的即时文字提示，不写入儿童成长记录，不代表真实内容审核已通过。</div></section></main><footer>原创 SVG 主文件可编辑与无限缩放；PNG/WebP 仅为导出 · 不是 3D 模型 / AE 工程 · 实际业务行为由 StoryGroveModal 保留</footer>
<script>
(()=>{const cup=document.getElementById('cup'),frame=document.getElementById('frame'),log=document.getElementById('log');let pos='CENTER_TABLE',seen=new Set(),dragging=false;
const hint={NEXT_TO_BLOCK:'杯子比小积木大；观察的是同一个杯子。',CENTER_TABLE:'杯子回到中间；它自己的大小没有改变。',NEXT_TO_BUCKET:'杯子比大水桶小；参照物变了，杯子没有变。'};
const x={NEXT_TO_BLOCK:26,CENTER_TABLE:50,NEXT_TO_BUCKET:72};
function apply(next){pos=next;const mobile=matchMedia('(max-width:640px)').matches;const left=mobile?{NEXT_TO_BLOCK:13,CENTER_TABLE:39.5,NEXT_TO_BUCKET:65}[next]:x[next]-6.5;cup.style.left=left+'%';cup.dataset.drag='0';document.getElementById('block').classList.toggle('active',next==='NEXT_TO_BLOCK');document.getElementById('bucket').classList.toggle('active',next==='NEXT_TO_BUCKET');if(next!=='CENTER_TABLE')seen.add(next);log.innerHTML='<strong>'+hint[next]+'</strong><div class="evidence">已演示的对比位置：'+[...seen].join('、')+'；正式产品的观察证据由既有业务引擎管理。</div>'}
function snap(clientX){const r=frame.getBoundingClientRect(),relative=(clientX-r.left)/r.width;apply(relative<.38?'NEXT_TO_BLOCK':relative>.62?'NEXT_TO_BUCKET':'CENTER_TABLE')}
let ptrId=null;cup.addEventListener('pointerdown',e=>{ptrId=e.pointerId;dragging=true;cup.dataset.drag='1';cup.setPointerCapture(e.pointerId)});cup.addEventListener('pointermove',e=>{if(!dragging)return;const r=frame.getBoundingClientRect(),relative=(e.clientX-r.left)/r.width;cup.style.left=(100*Math.max(.12,Math.min(.81,relative)))+'%'});cup.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;snap(e.clientX)});cup.addEventListener('pointercancel',()=>{dragging=false;apply(pos)});cup.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();apply('NEXT_TO_BLOCK')}if(e.key==='ArrowRight'){e.preventDefault();apply('NEXT_TO_BUCKET')}if(e.key==='Enter'){e.preventDefault();apply('CENTER_TABLE')}});
document.querySelectorAll('[data-pos]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.pos)));document.querySelector('[data-inspect]').addEventListener('click',()=>{if(seen.has('NEXT_TO_BLOCK')&&seen.has('NEXT_TO_BUCKET'))log.innerHTML='<strong>同一只杯子，和积木比显大，和水桶比显小。</strong><div class="evidence">仅是视觉实验示例；正式达成状态仍以原业务证据门槛为准。</div>';else log.innerHTML='<strong>请先把杯子分别放到左边和右边观察。</strong><div class="evidence">尚未对比两边，不会假装达成。</div>'});})();
</script></body></html>
