<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="islandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#islandBg)"/>
  <!-- Sunny Rain Island Elements -->
  <!-- Sun -->
  <circle cx="180" cy="190" r="75" fill="#fde047" filter="url(#shadow)"/>
  <!-- Cloud -->
  <path d="M220 280 A 55 55 0 0 1 330 250 A 45 45 0 0 1 400 290 A 45 45 0 0 1 380 350 L 220 350 A 50 50 0 0 1 220 280 Z" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Calming Rain Drops -->
  <path d="M250 375 L 240 395" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M290 375 L 280 395" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M330 375 L 320 395" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <!-- Island Green Sprout -->
  <path d="M190 410 Q 230 380 270 410 Q 230 430 190 410 Z" fill="#4ade80"/>
</svg>
